name: Rotate Artifactory token
description: >
  Rotate a JFrog Artifactory access or identity token and write the new token
  back to a GitHub Actions secret (repository, environment, or organization).
branding:
  icon: refresh-cw
  color: blue

inputs:
  artifactory-url:
    description: 'Artifactory base URL, e.g. https://acme.jfrog.io'
    required: true
  refresh-token:
    description: 'Refresh token paired with the rotated token; enables the refresh flow in auto mode.'
    required: false
    default: ''
  admin-token:
    description: 'Optional bearer used for create/revoke when the rotated token lacks permission.'
    required: false
    default: ''
  method:
    description: 'Rotation method: auto | refresh | create'
    required: false
    default: 'auto'
  revoke-old:
    description: 'Revoke the old token after the new one is stored (true/false).'
    required: false
    default: 'false'
  include-reference-token:
    description: 'Include reference (identity) token in response: auto | yes | no'
    required: false
    default: 'auto'

  secret-name:
    description: >
      Name of the GitHub Actions secret to rotate. The current value is read
      from this secret via the workflow's secrets context and the new token is
      written back to the same secret on success.
    required: true
  secret-scope:
    description: 'Where the secret lives: repo | environment | organization'
    required: false
    default: 'repo'
  environment:
    description: 'Environment name; required when secret-scope=environment.'
    required: false
    default: ''
  organization:
    description: 'Organization login; required when secret-scope=organization.'
    required: false
    default: ''
  org-visibility:
    description: 'Org secret visibility (only when secret-scope=organization): all | private | selected'
    required: false
    default: 'private'
  repository:
    description: 'Target repo as owner/name (defaults to the current repository).'
    required: false
    default: ${{ github.repository }}
  github-token:
    description: >
      GitHub token with secrets:write on the target scope. The default
      GITHUB_TOKEN does NOT have this permission; use a fine-grained PAT or a
      GitHub App installation token.
    required: true

outputs:
  new-token-id:
    description: 'token_id of the newly issued Artifactory token.'
    value: ${{ steps.rotate.outputs.new-token-id }}
  expires-in:
    description: 'Lifetime of the new token in seconds (0 = non-expiring).'
    value: ${{ steps.rotate.outputs.expires-in }}
  is-identity-token:
    description: 'true when the new token is an identity (reference) token.'
    value: ${{ steps.rotate.outputs.is-identity-token }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false

    - name: Build art-rotate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cd "$ACTION_PATH/../.."
        CGO_ENABLED=0 go build -trimpath -tags 'netgo,osusergo' \
          -ldflags='-s -w' -buildvcs=false \
          -o "$RUNNER_TEMP/art-rotate" ./cmd/art-rotate

    - name: Rotate token
      id: rotate
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ inputs.artifactory-url }}
        ARTIFACTORY_TOKEN: ${{ secrets[inputs.secret-name] }}
        ARTIFACTORY_REFRESH_TOKEN: ${{ inputs.refresh-token }}
        ARTIFACTORY_ADMIN_TOKEN: ${{ inputs.admin-token }}
        METHOD: ${{ inputs.method }}
        REVOKE_OLD: ${{ inputs.revoke-old }}
        INCLUDE_REF: ${{ inputs.include-reference-token }}
        SECRET_NAME: ${{ inputs.secret-name }}
      run: |
        set -euo pipefail
        if [[ -z "${ARTIFACTORY_TOKEN:-}" ]]; then
          echo "ERROR: workflow secret '$SECRET_NAME' is unset or empty — cannot rotate." >&2
          echo "       (Make sure the secret exists in the scope the workflow runs under" >&2
          echo "        and is visible to this job — e.g. environment secrets require" >&2
          echo "        the job to declare 'environment:'.)" >&2
          exit 1
        fi
        args=(
          --method "$METHOD"
          --include-reference-token "$INCLUDE_REF"
        )
        if [[ "$REVOKE_OLD" == "true" ]]; then
          args+=(--revoke-old)
        fi

        json_out="$RUNNER_TEMP/art-rotate.out.json"
        # art-rotate reads --url/--token/--refresh-token/--admin-token from
        # the env vars set above; stdout is the JSON payload, stderr is logs.
        "$RUNNER_TEMP/art-rotate" "${args[@]}" > "$json_out"

        new_access=$(jq -r '.access_token' "$json_out")
        new_ref=$(jq -r '.reference_token // empty' "$json_out")
        token_id=$(jq -r '.token_id' "$json_out")
        expires_in=$(jq -r '.expires_in // 0' "$json_out")
        is_identity=$(jq -r '.is_identity_token // false' "$json_out")

        # Prefer the reference (opaque) form when present — that's what
        # identity-token consumers expect. Fall back to the JWT.
        new_value="$new_access"
        if [[ -n "$new_ref" ]]; then
          new_value="$new_ref"
        fi

        # Mask BEFORE writing anywhere else, so any future echo of these
        # strings is redacted in the live log.
        echo "::add-mask::$new_value"
        echo "::add-mask::$new_access"
        if [[ -n "$new_ref" ]]; then
          echo "::add-mask::$new_ref"
        fi

        # Hand the new value to the next step via a 0600 file (avoids
        # round-tripping through env vars, which can be inspected on
        # self-hosted runners).
        umask 077
        printf '%s' "$new_value" > "$RUNNER_TEMP/new_token"

        {
          echo "new-token-id=$token_id"
          echo "expires-in=$expires_in"
          echo "is-identity-token=$is_identity"
        } >> "$GITHUB_OUTPUT"

        rm -f "$json_out"

    - name: Update GitHub secret
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SECRET_NAME: ${{ inputs.secret-name }}
        SECRET_SCOPE: ${{ inputs.secret-scope }}
        SECRET_ENV: ${{ inputs.environment }}
        SECRET_ORG: ${{ inputs.organization }}
        ORG_VIS: ${{ inputs.org-visibility }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        token_file="$RUNNER_TEMP/new_token"
        trap 'rm -f "$token_file"' EXIT
        case "$SECRET_SCOPE" in
          repo)
            gh secret set "$SECRET_NAME" --repo "$REPO" --body-file "$token_file"
            ;;
          environment)
            if [[ -z "$SECRET_ENV" ]]; then
              echo "ERROR: secret-scope=environment requires the 'environment' input" >&2
              exit 1
            fi
            gh secret set "$SECRET_NAME" --repo "$REPO" --env "$SECRET_ENV" --body-file "$token_file"
            ;;
          organization)
            if [[ -z "$SECRET_ORG" ]]; then
              echo "ERROR: secret-scope=organization requires the 'organization' input" >&2
              exit 1
            fi
            gh secret set "$SECRET_NAME" --org "$SECRET_ORG" \
              --visibility "$ORG_VIS" --body-file "$token_file"
            ;;
          *)
            echo "ERROR: unknown secret-scope: $SECRET_SCOPE (want repo|environment|organization)" >&2
            exit 1
            ;;
        esac
        echo "INFO: stored new Artifactory token in $SECRET_SCOPE secret '$SECRET_NAME'"
