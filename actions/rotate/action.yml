name: Rotate Artifactory token
description: >
  Rotate a JFrog Artifactory access or identity token. Takes the existing
  token as input and emits the new token as an output. Storing the new value
  back into any secret store (GitHub Actions, Vault, etc.) is the caller's
  responsibility — this action does only the Artifactory-side rotation.
branding:
  icon: refresh-cw
  color: blue

inputs:
  artifactory-url:
    description: 'Artifactory base URL, e.g. https://acme.jfrog.io'
    required: true
  artifactory-token:
    description: 'Existing access or identity token to rotate.'
    required: true
  refresh-token:
    description: 'Optional refresh token paired with artifactory-token; enables the refresh flow in auto mode.'
    required: false
    default: ''
  admin-token:
    description: 'Optional bearer used for create/revoke when the rotated token lacks permission.'
    required: false
    default: ''
  method:
    description: 'Rotation method: auto | refresh | create'
    required: false
    default: 'auto'
  revoke-old:
    description: 'Revoke the old token after the new one is issued (true/false).'
    required: false
    default: 'false'
  include-reference-token:
    description: 'Include reference (identity) token in response: auto | yes | no'
    required: false
    default: 'auto'
  min-age:
    description: >
      Rotate only if the current token was issued at least this long ago
      (Go duration, e.g. 168h). Empty disables. OR-combined with expires-within.
    required: false
    default: ''
  expires-within:
    description: >
      Rotate only if the current token expires within this duration
      (Go duration, e.g. 24h). Non-expiring tokens never satisfy this gate.
      Empty disables. OR-combined with min-age.
    required: false
    default: ''
  version:
    description: >
      art-rotate release tag to download (e.g. v0.3.0). Defaults to the ref
      this action is invoked at, so `@v0.3.0` pulls the v0.3.0 binary. Set
      explicitly when invoking the action via a SHA or branch ref.
    required: false
    default: ''

outputs:
  new-token:
    description: >
      The new token. Prefers the reference (opaque) form when the source was
      an identity token; otherwise the JWT access token. Always masked.
    value: ${{ steps.rotate.outputs.new-token }}
  new-token-id:
    description: 'token_id of the newly issued Artifactory token.'
    value: ${{ steps.rotate.outputs.new-token-id }}
  expires-in:
    description: 'Lifetime of the new token in seconds (0 = non-expiring).'
    value: ${{ steps.rotate.outputs.expires-in }}
  is-identity-token:
    description: 'true when the new token is an identity (reference) token.'
    value: ${{ steps.rotate.outputs.is-identity-token }}
  skipped:
    description: >
      'true' when a rotation gate (min-age / expires-within) was set but not
      satisfied, so no new token was issued. Other outputs are empty in this
      case. Guard downstream steps with `if: steps.rotate.outputs.skipped != 'true'`.
    value: ${{ steps.rotate.outputs.skipped }}
  skip-reason:
    description: 'Human-readable reason when skipped is true.'
    value: ${{ steps.rotate.outputs.skip-reason }}

runs:
  using: composite
  steps:
    - name: Download art-rotate binary
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="${REQUESTED_VERSION:-$ACTION_REF}"
        if [[ -z "$version" ]]; then
          echo "ERROR: cannot determine art-rotate release to download." >&2
          echo "       Pin the action to a release tag (e.g. @v0.3.0) or set" >&2
          echo "       the 'version' input." >&2
          exit 1
        fi

        case "$(uname -s)" in
          Linux*)  goos=linux  ;;
          Darwin*) goos=darwin ;;
          *) echo "ERROR: unsupported OS $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)   goarch=amd64 ;;
          arm64|aarch64)  goarch=arm64 ;;
          *) echo "ERROR: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac

        archive="art-rotate_${version}_${goos}_${goarch}.tar.gz"
        base="https://github.com/tpyle/art-rotate/releases/download/${version}"

        echo "INFO: downloading ${base}/${archive}"
        curl -fsSL -o "$RUNNER_TEMP/${archive}"  "${base}/${archive}"
        curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS"  "${base}/SHA256SUMS"

        (cd "$RUNNER_TEMP" && sha256sum --ignore-missing -c SHA256SUMS)

        tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP" art-rotate
        chmod +x "$RUNNER_TEMP/art-rotate"
        rm -f "$RUNNER_TEMP/${archive}" "$RUNNER_TEMP/SHA256SUMS"

    - name: Rotate token
      id: rotate
      shell: bash
      env:
        ARTIFACTORY_URL: ${{ inputs.artifactory-url }}
        ARTIFACTORY_TOKEN: ${{ inputs.artifactory-token }}
        ARTIFACTORY_REFRESH_TOKEN: ${{ inputs.refresh-token }}
        ARTIFACTORY_ADMIN_TOKEN: ${{ inputs.admin-token }}
        METHOD: ${{ inputs.method }}
        REVOKE_OLD: ${{ inputs.revoke-old }}
        INCLUDE_REF: ${{ inputs.include-reference-token }}
        MIN_AGE: ${{ inputs.min-age }}
        EXPIRES_WITHIN: ${{ inputs.expires-within }}
      run: |
        set -euo pipefail
        if [[ -z "${ARTIFACTORY_TOKEN:-}" ]]; then
          echo "ERROR: artifactory-token input is empty" >&2
          exit 1
        fi
        args=(--method "$METHOD" --include-reference-token "$INCLUDE_REF")
        if [[ "$REVOKE_OLD" == "true" ]]; then
          args+=(--revoke-old)
        fi
        if [[ -n "$MIN_AGE" ]]; then
          args+=(--min-age "$MIN_AGE")
        fi
        if [[ -n "$EXPIRES_WITHIN" ]]; then
          args+=(--expires-within "$EXPIRES_WITHIN")
        fi
        json_out="$RUNNER_TEMP/art-rotate.out.json"
        "$RUNNER_TEMP/art-rotate" "${args[@]}" > "$json_out"

        skipped=$(jq -r '.skipped // false' "$json_out")
        if [[ "$skipped" == "true" ]]; then
          reason=$(jq -r '.skip_reason // ""' "$json_out")
          old_id=$(jq -r '.old_token_id // ""' "$json_out")
          echo "INFO: rotation skipped — $reason (old token_id=$old_id)" >&2
          {
            echo "skipped=true"
            echo "skip-reason=$reason"
            echo "new-token="
            echo "new-token-id="
            echo "expires-in=0"
            echo "is-identity-token=false"
          } >> "$GITHUB_OUTPUT"
          rm -f "$json_out"
          exit 0
        fi

        new_access=$(jq -r '.access_token' "$json_out")
        new_ref=$(jq -r '.reference_token // empty' "$json_out")
        token_id=$(jq -r '.token_id' "$json_out")
        expires_in=$(jq -r '.expires_in // 0' "$json_out")
        is_identity=$(jq -r '.is_identity_token // false' "$json_out")

        new_value="$new_access"
        if [[ -n "$new_ref" ]]; then new_value="$new_ref"; fi

        # Mask every form of the new token before emitting outputs.
        echo "::add-mask::$new_value"
        echo "::add-mask::$new_access"
        if [[ -n "$new_ref" ]]; then echo "::add-mask::$new_ref"; fi

        {
          echo "skipped=false"
          echo "new-token<<__ART_ROTATE_EOF__"
          printf '%s\n' "$new_value"
          echo "__ART_ROTATE_EOF__"
          echo "new-token-id=$token_id"
          echo "expires-in=$expires_in"
          echo "is-identity-token=$is_identity"
        } >> "$GITHUB_OUTPUT"
        rm -f "$json_out"
