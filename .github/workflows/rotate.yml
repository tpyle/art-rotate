# Reusable workflow: rotate an Artifactory access or identity token and write
# the new value back to a GitHub Actions secret.
#
# IMPORTANT — this workflow only runs when invoked by another workflow via
# `uses: tpyle/art-rotate/.github/workflows/rotate.yml@<ref>`. It does NOT
# run from this repository on its own; there is no schedule or trigger
# besides workflow_call, so this repo never performs rotations against
# itself.
#
# Callers MUST pass `secrets: inherit` so the dynamic lookup
# `secrets[inputs.secret-name]` can resolve.
name: Rotate Artifactory token

on:
  workflow_call:
    inputs:
      artifactory-url:
        type: string
        required: true
        description: 'Artifactory base URL, e.g. https://acme.jfrog.io'
      secret-name:
        type: string
        required: true
        description: >
          Name of the workflow secret holding the Artifactory token to rotate.
          The current value is read from this secret and the new value is
          written back to the same secret on success.

      # ---- GitHub auth (pick exactly one mode) ----
      github-pat-secret-name:
        type: string
        default: ''
        description: >
          Name of a secret holding a PAT with Actions secrets:write on the
          target scope. Mutually exclusive with the App inputs below.
      app-id:
        type: string
        default: ''
        description: 'GitHub App ID (or client ID). When set with app-private-key-secret-name, an installation token is minted at runtime.'
      app-private-key-secret-name:
        type: string
        default: ''
        description: 'Name of a secret holding the GitHub App private key (.pem contents).'

      # ---- Rotation behaviour ----
      refresh-token-secret-name:
        type: string
        default: ''
      admin-token-secret-name:
        type: string
        default: ''
      method:
        type: string
        default: 'auto'
        description: 'auto | refresh | create'
      revoke-old:
        type: boolean
        default: false
      include-reference-token:
        type: string
        default: 'auto'
        description: 'auto | yes | no'

      # ---- Where the GitHub secret lives ----
      secret-scope:
        type: string
        default: 'repo'
        description: 'repo | environment | organization'
      environment:
        type: string
        default: ''
      organization:
        type: string
        default: ''
      org-visibility:
        type: string
        default: 'private'
      target-repository:
        type: string
        default: ''
        description: 'owner/name. Defaults to the calling repository.'

      # ---- Source of the art-rotate binary ----
      source-repo:
        type: string
        default: 'tpyle/art-rotate'
        description: 'Repo to check out and build art-rotate from. Override for forks.'
      source-ref:
        type: string
        default: 'main'
        description: 'Git ref of source-repo to build. Pin to a tag for reproducible rotations.'

    outputs:
      new-token-id:
        value: ${{ jobs.rotate.outputs.new-token-id }}
      expires-in:
        value: ${{ jobs.rotate.outputs.expires-in }}
      is-identity-token:
        value: ${{ jobs.rotate.outputs.is-identity-token }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    outputs:
      new-token-id: ${{ steps.rotate.outputs.new-token-id }}
      expires-in: ${{ steps.rotate.outputs.expires-in }}
      is-identity-token: ${{ steps.rotate.outputs.is-identity-token }}
    steps:
      - name: Validate auth mode
        shell: bash
        env:
          PAT_NAME: ${{ inputs.github-pat-secret-name }}
          APP_ID: ${{ inputs.app-id }}
          APP_KEY_NAME: ${{ inputs.app-private-key-secret-name }}
        run: |
          set -euo pipefail
          have_pat=0; have_app=0
          [[ -n "$PAT_NAME" ]] && have_pat=1
          if [[ -n "$APP_ID" && -n "$APP_KEY_NAME" ]]; then have_app=1; fi
          if (( have_pat + have_app != 1 )); then
            echo "ERROR: provide exactly one of:" >&2
            echo "  - github-pat-secret-name" >&2
            echo "  - app-id AND app-private-key-secret-name" >&2
            exit 1
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: inputs.app-id != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets[inputs.app-private-key-secret-name] }}
          owner: ${{ github.repository_owner }}

      - name: Check out art-rotate source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ inputs.source-ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build art-rotate
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -tags 'netgo,osusergo' \
            -ldflags='-s -w' -buildvcs=false \
            -o "$RUNNER_TEMP/art-rotate" ./cmd/art-rotate

      - name: Rotate token
        id: rotate
        shell: bash
        env:
          ARTIFACTORY_URL: ${{ inputs.artifactory-url }}
          ARTIFACTORY_TOKEN: ${{ secrets[inputs.secret-name] }}
          ARTIFACTORY_REFRESH_TOKEN: ${{ inputs.refresh-token-secret-name != '' && secrets[inputs.refresh-token-secret-name] || '' }}
          ARTIFACTORY_ADMIN_TOKEN: ${{ inputs.admin-token-secret-name != '' && secrets[inputs.admin-token-secret-name] || '' }}
          METHOD: ${{ inputs.method }}
          REVOKE_OLD: ${{ inputs.revoke-old }}
          INCLUDE_REF: ${{ inputs.include-reference-token }}
          SECRET_NAME: ${{ inputs.secret-name }}
        run: |
          set -euo pipefail
          if [[ -z "${ARTIFACTORY_TOKEN:-}" ]]; then
            echo "ERROR: workflow secret '$SECRET_NAME' is unset or empty." >&2
            echo "       This usually means the caller forgot 'secrets: inherit'" >&2
            echo "       on the workflow_call invocation, or the secret doesn't" >&2
            echo "       exist in the scope this job runs under (environment" >&2
            echo "       secrets require the job to declare 'environment:')." >&2
            exit 1
          fi
          args=(--method "$METHOD" --include-reference-token "$INCLUDE_REF")
          if [[ "$REVOKE_OLD" == "true" ]]; then
            args+=(--revoke-old)
          fi
          json_out="$RUNNER_TEMP/art-rotate.out.json"
          "$RUNNER_TEMP/art-rotate" "${args[@]}" > "$json_out"

          new_access=$(jq -r '.access_token' "$json_out")
          new_ref=$(jq -r '.reference_token // empty' "$json_out")
          token_id=$(jq -r '.token_id' "$json_out")
          expires_in=$(jq -r '.expires_in // 0' "$json_out")
          is_identity=$(jq -r '.is_identity_token // false' "$json_out")

          new_value="$new_access"
          if [[ -n "$new_ref" ]]; then new_value="$new_ref"; fi
          echo "::add-mask::$new_value"
          echo "::add-mask::$new_access"
          if [[ -n "$new_ref" ]]; then echo "::add-mask::$new_ref"; fi

          umask 077
          printf '%s' "$new_value" > "$RUNNER_TEMP/new_token"
          {
            echo "new-token-id=$token_id"
            echo "expires-in=$expires_in"
            echo "is-identity-token=$is_identity"
          } >> "$GITHUB_OUTPUT"
          rm -f "$json_out"

      - name: Update GitHub secret
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets[inputs.github-pat-secret-name] }}
          SECRET_NAME: ${{ inputs.secret-name }}
          SECRET_SCOPE: ${{ inputs.secret-scope }}
          SECRET_ENV: ${{ inputs.environment }}
          SECRET_ORG: ${{ inputs.organization }}
          ORG_VIS: ${{ inputs.org-visibility }}
          REPO: ${{ inputs.target-repository != '' && inputs.target-repository || github.repository }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/new_token"
          trap 'rm -f "$token_file"' EXIT
          case "$SECRET_SCOPE" in
            repo)
              gh secret set "$SECRET_NAME" --repo "$REPO" --body-file "$token_file"
              ;;
            environment)
              if [[ -z "$SECRET_ENV" ]]; then
                echo "ERROR: secret-scope=environment requires the 'environment' input" >&2
                exit 1
              fi
              gh secret set "$SECRET_NAME" --repo "$REPO" --env "$SECRET_ENV" --body-file "$token_file"
              ;;
            organization)
              if [[ -z "$SECRET_ORG" ]]; then
                echo "ERROR: secret-scope=organization requires the 'organization' input" >&2
                exit 1
              fi
              gh secret set "$SECRET_NAME" --org "$SECRET_ORG" \
                --visibility "$ORG_VIS" --body-file "$token_file"
              ;;
            *)
              echo "ERROR: unknown secret-scope: $SECRET_SCOPE (want repo|environment|organization)" >&2
              exit 1
              ;;
          esac
          echo "INFO: stored new Artifactory token in $SECRET_SCOPE secret '$SECRET_NAME'"
