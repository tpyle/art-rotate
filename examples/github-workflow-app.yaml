# Example: rotate an Artifactory token using a GitHub App for the
# GitHub-side secrets:write permission. The App token is minted inline in
# the same job and used by the final `gh secret set` step.
#
# Setup:
#   1. Create a GitHub App (Settings → Developer settings → GitHub Apps).
#      Repository permissions → Secrets: Read and write.
#   2. Generate and download a .pem private key.
#   3. Install the App on the repo(s) it should manage.
#   4. Add these secrets to the consuming repo:
#        ARTIFACTORY_TOKEN      — the Artifactory token to rotate
#        ROTATE_APP_PRIVATE_KEY — contents of the downloaded .pem file
#   5. Note the App ID (numeric or client ID); it's passed as a literal,
#      not a secret.
name: Rotate Artifactory token (GitHub App)

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      revoke-old:
        description: 'Revoke the old token after rotation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: '123456'   # your App's numeric or client ID
          private-key: ${{ secrets.ROTATE_APP_PRIVATE_KEY }}

      - name: Rotate Artifactory token
        id: rotate
        uses: tpyle/art-rotate/actions/rotate@v0.3.0
        with:
          artifactory-url: https://acme.jfrog.io
          artifactory-token: ${{ secrets.ARTIFACTORY_TOKEN }}
          revoke-old: ${{ inputs.revoke-old || 'false' }}

      - name: Write new token back to GitHub secret
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TOKEN: ${{ steps.rotate.outputs.new-token }}
        run: |
          printf '%s' "$NEW_TOKEN" \
            | gh secret set ARTIFACTORY_TOKEN --repo "$GITHUB_REPOSITORY"
