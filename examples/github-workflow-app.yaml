# Example: rotate an Artifactory token using a GitHub App for the
# GitHub-side secrets:write permission.
#
# A GitHub App is the safer alternative to a PAT: the installation token is
# minted at runtime inside the reusable workflow (short-lived, ~1h), scoped
# to whichever repos the App is installed on, and does not depend on any
# user account.
#
# Setup:
#   1. Create a GitHub App (Settings → Developer settings → GitHub Apps).
#      Repository permissions → Secrets: Read and write.
#   2. Generate and download a .pem private key.
#   3. Install the App on the repo(s) it should manage.
#   4. Add these secrets in the calling repo:
#        ARTIFACTORY_TOKEN      — the Artifactory token to rotate
#        ROTATE_APP_PRIVATE_KEY — the contents of the downloaded .pem file
#   5. Note the App ID (numeric or client ID) — passed as a literal input,
#      not a secret.
name: Rotate Artifactory token (GitHub App)

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      revoke-old:
        description: 'Revoke the old token after rotation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rotate:
    # Replace @REF with a published tag/sha, e.g. @v0.1.0
    uses: tpyle/art-rotate/.github/workflows/rotate.yml@REF
    with:
      artifactory-url: https://acme.jfrog.io
      secret-name: ARTIFACTORY_TOKEN
      app-id: '123456'   # your GitHub App's numeric or client ID
      app-private-key-secret-name: ROTATE_APP_PRIVATE_KEY
      revoke-old: ${{ inputs.revoke-old || false }}
    secrets: inherit
