# Example: rotate an Artifactory token on a schedule, using a PAT for the
# GitHub-side secrets:write permission.
#
# Drop this file into .github/workflows/ in any repo that needs scheduled
# rotation. It is intentionally NOT installed under .github/ in this repo —
# this repo holds the reusable workflow's source, not a live rotation.
#
# Set up two secrets in the calling repo first:
#   ARTIFACTORY_TOKEN — the Artifactory token to rotate. The reusable
#                       workflow reads its current value via the inherited
#                       secrets context and writes the new value back to
#                       the same secret on success. You name it once via
#                       'secret-name'; no second secrets.X reference is
#                       needed.
#   ROTATE_GH_TOKEN   — a PAT with Actions secrets:write on the target
#                       scope. The default GITHUB_TOKEN does NOT have that
#                       permission and cannot be granted it via the
#                       permissions: block.
name: Rotate Artifactory token

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      revoke-old:
        description: 'Revoke the old token after rotation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rotate:
    # Replace @REF with a published tag/sha, e.g. @v0.1.0
    uses: tpyle/art-rotate/.github/workflows/rotate.yml@REF
    with:
      artifactory-url: https://acme.jfrog.io
      secret-name: ARTIFACTORY_TOKEN
      github-pat-secret-name: ROTATE_GH_TOKEN
      revoke-old: ${{ inputs.revoke-old || false }}
    secrets: inherit
