# Example: rotate an Artifactory token on a schedule, using a PAT to write
# the new value back into a GitHub Actions secret.
#
# Drop this into .github/workflows/ in the consuming repo. The action only
# rotates Artifactory-side; everything around it (where the old token comes
# from, where the new one goes) is the workflow's job. That makes the auth
# story for the GitHub side a normal `gh secret set` call with whatever
# token you have available.
#
# Secrets the consuming repo needs:
#   ARTIFACTORY_TOKEN — the token to rotate. The new value is written back
#                       to the same secret.
#   ROTATE_GH_TOKEN   — PAT with Actions secrets:write on this repo. The
#                       default GITHUB_TOKEN does NOT have that permission.
name: Rotate Artifactory token

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      revoke-old:
        description: 'Revoke the old token after rotation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate Artifactory token
        id: rotate
        uses: tpyle/art-rotate/actions/rotate@v0.3.0
        with:
          artifactory-url: https://acme.jfrog.io
          artifactory-token: ${{ secrets.ARTIFACTORY_TOKEN }}
          revoke-old: ${{ inputs.revoke-old || 'false' }}

      - name: Write new token back to GitHub secret
        env:
          GH_TOKEN: ${{ secrets.ROTATE_GH_TOKEN }}
          NEW_TOKEN: ${{ steps.rotate.outputs.new-token }}
        run: |
          # gh secret set reads from stdin when --body is omitted, which
          # keeps the value off the command line.
          printf '%s' "$NEW_TOKEN" \
            | gh secret set ARTIFACTORY_TOKEN --repo "$GITHUB_REPOSITORY"
